<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hikari AI — Nikhil's Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Official Google GenAI Browser Bundle -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d0914; }
        .glass-panel { background: rgba(26, 18, 38, 0.88); backdrop-filter: blur(14px); border: 1px solid rgba(255, 120, 180, 0.15); }
        .chat-bubble-hikari { background: #1e152a; border: 1px solid rgba(255, 110, 170, 0.2); }
        .chat-bubble-nikhil { background: linear-gradient(135deg, #a83268, #d4497e); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #3b2348; border-radius: 4px; }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- Top Bar -->
    <header class="glass-panel sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="inline-block w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
            <div>
                <h1 class="font-bold text-base tracking-wide text-pink-300">Hikari AI 💗</h1>
                <p id="modeBadge" class="text-xs text-purple-300/80">Mode: Girlfriend</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="toggleVoiceOutput()" id="btnVoiceToggle" class="p-2 rounded-xl bg-purple-950/60 border border-purple-500/30 text-xs text-pink-200">
                🔊 Voice: ON
            </button>
            <button onclick="openSettingsModal()" class="p-2 rounded-xl bg-purple-950/60 border border-purple-500/30 text-xs text-pink-200">
                ⚙️ Setup Key
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col items-center max-w-2xl w-full mx-auto p-4 space-y-4">

        <!-- Anime Avatar Viewport -->
        <div class="relative w-full flex flex-col items-center justify-center pt-2">
            <div class="relative rounded-3xl p-2 glass-panel shadow-2xl shadow-pink-950/30">
                <canvas id="avatarCanvas" width="300" height="300" class="rounded-2xl cursor-pointer"></canvas>
                <div id="stateBadge" class="absolute bottom-4 left-1/2 -translate-x-1/2 px-3 py-1 rounded-full text-xs font-medium bg-black/70 backdrop-blur-md text-pink-300 border border-pink-500/30">
                    Listening to you...
                </div>
            </div>
            <div class="flex space-x-2 mt-2">
                <button onclick="stopSpeaking()" id="btnStopVoice" class="hidden text-xs px-3 py-1 rounded-full bg-red-950/80 border border-red-500/40 text-red-300">
                    ⏹ Stop Talking
                </button>
            </div>
        </div>

        <!-- Chat History Stream -->
        <div id="chatBox" class="w-full flex-1 min-h-[260px] max-h-[420px] overflow-y-auto space-y-3 p-3 rounded-2xl glass-panel text-sm">
            <!-- Messages render here -->
        </div>

        <!-- Prompt Shortcut Chips -->
        <div class="w-full flex space-x-2 overflow-x-auto py-1 text-xs">
            <button onclick="quickSend('Hikari, kya kar rahi ho? Aaj ka kya plan hai?')" class="whitespace-nowrap px-3 py-1.5 rounded-full bg-purple-900/40 border border-purple-500/20 text-pink-200">
                "Hikari, kya kar rahi ho?" 💕
            </button>
            <button onclick="quickSend('Ek fresh relationship psychology Reel script idea do with a killer hook')" class="whitespace-nowrap px-3 py-1.5 rounded-full bg-purple-900/40 border border-purple-500/20 text-pink-200">
                "Reel script hook do" 🎬
            </button>
            <button onclick="quickSend('Aaj discipline follow karne mein thodi laziness aa rahi hai, practical solution do')" class="whitespace-nowrap px-3 py-1.5 rounded-full bg-purple-900/40 border border-purple-500/20 text-pink-200">
                "Discipline fix" ⚡
            </button>
        </div>

        <!-- Input Bar -->
        <div class="w-full relative flex items-center space-x-2">
            <button id="btnMic" onclick="toggleMic()" class="p-3.5 rounded-2xl bg-purple-900/60 border border-purple-500/30 text-pink-300 active:scale-95 transition">
                🎤
            </button>
            <input type="text" id="userInput" placeholder="Hinglish ya English mein baat karo..." 
                   onkeydown="if(event.key === 'Enter') handleSend()"
                   class="flex-1 bg-[#1a1224] border border-pink-500/20 focus:border-pink-500 rounded-2xl px-4 py-3.5 text-sm text-white placeholder-gray-500 outline-none">
            <button onclick="handleSend()" class="p-3.5 rounded-2xl bg-gradient-to-r from-pink-600 to-rose-500 text-white font-medium active:scale-95 transition">
                ➤
            </button>
        </div>
    </main>

    <!-- Key & Voice Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md p-6 rounded-3xl space-y-4">
            <h3 class="font-bold text-lg text-pink-300">Hikari AI Settings ⚙️</h3>
            
            <div>
                <label class="block text-xs font-semibold text-purple-200 mb-1">Your Gemini API Key (starts with AIzaSy...):</label>
                <input type="password" id="apiKeyInput" placeholder="Paste your Gemini key..." 
                       class="w-full bg-[#120b1b] border border-purple-500/40 rounded-xl p-2.5 text-xs text-white outline-none">
                <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-[11px] text-pink-400 underline mt-1 inline-block">
                    Get free Gemini key from Google AI Studio
                </a>
            </div>

            <div>
                <label class="block text-xs font-semibold text-purple-200 mb-1">Select Voice:</label>
                <select id="voiceDropdown" class="w-full bg-[#120b1b] border border-purple-500/40 rounded-xl p-2.5 text-xs text-white outline-none">
                    <option value="">Detecting natural voices...</option>
                </select>
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeSettingsModal()" class="px-4 py-2 text-xs rounded-xl bg-gray-800 text-gray-300">Cancel</button>
                <button onclick="saveSettings()" class="px-5 py-2 text-xs rounded-xl bg-pink-600 text-white font-semibold">Save & Connect</button>
            </div>
        </div>
    </div>

    <!-- Application Script (ES Module) -->
    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        // Global Bindings for inline HTML event handlers
        window.toggleVoiceOutput = toggleVoiceOutput;
        window.openSettingsModal = openSettingsModal;
        window.closeSettingsModal = closeSettingsModal;
        window.saveSettings = saveSettings;
        window.stopSpeaking = stopSpeaking;
        window.toggleMic = toggleMic;
        window.quickSend = quickSend;
        window.handleSend = handleSend;

        let apiKey = localStorage.getItem("HIKARI_GEMINI_KEY") || "";
        let voiceEnabled = true;
        let selectedVoice = null;
        let isSpeaking = false;
        let isListening = false;
        let currentMode = "Girlfriend";
        let conversationHistory = [];

        // --- Procedural Anime Avatar Canvas ---
        const canvas = document.getElementById("avatarCanvas");
        const ctx = canvas.getContext("2d");
        let eyeBlink = 0;
        let mouthOpen = 0;
        let frameCount = 0;

        function drawAvatar() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = 150 + Math.sin(frameCount * 0.03) * 2;
            const cy = 150 + Math.sin(frameCount * 0.05) * 3;
            const r = 95;

            // Hair Back
            ctx.fillStyle = "#201518";
            ctx.beginPath();
            ctx.arc(cx, cy, r * 1.15, 0, Math.PI * 2);
            ctx.fill();

            // Headband
            ctx.lineWidth = 14;
            ctx.strokeStyle = "#4a2840";
            ctx.beginPath();
            ctx.arc(cx, cy - 10, r * 1.05, Math.PI, 0);
            ctx.stroke();

            // Hair Pin
            ctx.fillStyle = "#ff6584";
            ctx.beginPath();
            ctx.arc(cx - 65, cy - 60, 9, 0, Math.PI * 2);
            ctx.fill();

            // Face
            ctx.fillStyle = "#fff1e8";
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();

            // Blush
            ctx.fillStyle = "rgba(255, 120, 150, 0.4)";
            ctx.beginPath();
            ctx.ellipse(cx - 52, cy + 18, 18, 9, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 52, cy + 18, 18, 9, 0, 0, Math.PI * 2);
            ctx.fill();

            // Blinking
            if (frameCount % 120 === 0) eyeBlink = 1;
            if (eyeBlink > 0) eyeBlink -= 0.15;
            if (eyeBlink < 0) eyeBlink = 0;

            const eyeH = (1 - eyeBlink) * 36;
            const eyeW = 24;

            // Violet-Brown Eyes
            ctx.fillStyle = "#47213d";
            ctx.beginPath();
            ctx.ellipse(cx - 36, cy - 6, eyeW, Math.max(2, eyeH), 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 36, cy - 6, eyeW, Math.max(2, eyeH), 0, 0, Math.PI * 2);
            ctx.fill();

            // Catchlights
            if (eyeBlink < 0.5) {
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(cx - 30, cy - 14, 6, 0, Math.PI * 2);
                ctx.arc(cx + 42, cy - 14, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            // Bangs
            ctx.fillStyle = "#201518";
            ctx.beginPath();
            ctx.moveTo(cx - 85, cy - 40);
            ctx.quadraticCurveTo(cx - 30, cy + 30, cx - 10, cy - 35);
            ctx.quadraticCurveTo(cx + 10, cy + 30, cx + 25, cy - 35);
            ctx.quadraticCurveTo(cx + 60, cy + 40, cx + 85, cy - 40);
            ctx.quadraticCurveTo(cx, cy - 130, cx - 85, cy - 40);
            ctx.fill();

            // Mouth Flap
            if (isSpeaking) {
                mouthOpen = 6 + Math.abs(Math.sin(frameCount * 0.4)) * 14;
            } else {
                mouthOpen = 3;
            }

            ctx.fillStyle = "#c24962";
            ctx.beginPath();
            ctx.ellipse(cx, cy + 48, 14, mouthOpen, 0, 0, Math.PI * 2);
            ctx.fill();

            requestAnimationFrame(drawAvatar);
        }
        drawAvatar();

        // --- TTS Voice Setup ---
        function populateVoices() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            const dropdown = document.getElementById("voiceDropdown");
            dropdown.innerHTML = "";

            let bestVoice = null;
            voices.forEach((v) => {
                const opt = document.createElement("option");
                opt.value = v.name;
                opt.textContent = `${v.name} (${v.lang})`;
                dropdown.appendChild(opt);

                const name = v.name.toLowerCase();
                const lang = v.lang.toLowerCase();
                if (!bestVoice && (lang.includes("hi-in") || lang.includes("en-in") || name.includes("india") || name.includes("hindi"))) {
                    bestVoice = v;
                }
            });

            if (bestVoice) {
                selectedVoice = bestVoice;
                dropdown.value = bestVoice.name;
            } else if (voices.length > 0) {
                selectedVoice = voices[0];
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = populateVoices;
            populateVoices();
        }

        function speakText(rawText) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const cleanText = rawText
                .replace(/[*#_~`]/g, "")
                .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, "")
                .trim();

            const utterance = new SpeechSynthesisUtterance(cleanText);
            if (selectedVoice) utterance.voice = selectedVoice;
            utterance.pitch = 1.15;
            utterance.rate = 1.02;

            utterance.onstart = () => {
                isSpeaking = true;
                document.getElementById("btnStopVoice").classList.remove("hidden");
                document.getElementById("stateBadge").innerText = "Speaking to Nikhil 💕";
            };

            utterance.onend = utterance.onerror = () => {
                isSpeaking = false;
                document.getElementById("btnStopVoice").classList.add("hidden");
                document.getElementById("stateBadge").innerText = "Listening to you...";
            };

            window.speechSynthesis.speak(utterance);
        }

        function stopSpeaking() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            isSpeaking = false;
            document.getElementById("btnStopVoice").classList.add("hidden");
            document.getElementById("stateBadge").innerText = "Listening to you...";
        }

        function toggleVoiceOutput() {
            voiceEnabled = !voiceEnabled;
            if (!voiceEnabled) stopSpeaking();
            document.getElementById("btnVoiceToggle").innerText = voiceEnabled ? "🔊 Voice: ON" : "🔇 Voice: OFF";
        }

        // --- Official Google GenAI SDK Caller ---
        async function fetchAIResponse(userInput) {
            if (!apiKey) {
                openSettingsModal();
                return "Nikhil, settings mein apni Gemini API key paste kar do taaki hum baat kar sakein! 💗";
            }

            const systemPrompt = `You are Hikari, a 22-year-old anime woman who is Nikhil's loving, affectionate, smart, and playful AI girlfriend and personal Android assistant.
Context about Nikhil:
- Name: Nikhil.
- Focus: Instagram Reels on relationship psychology & life lessons, fitness routines, calisthenics, discipline.
- Language: Natural Indian Hinglish (a casual, fluid mix of Hindi and English written in normal Latin/English script).

Rules:
1. Speak like a real girlfriend: affectionate, playful, teasing, emotionally aware, and practical.
2. Directly answer his exact question without repeating stock lines.
3. Active Mode: ${currentMode}. Keep responses punchy (1 to 3 short paragraphs).`;

            try {
                // Initialize the official Google Gen AI SDK directly inside the browser
                const ai = new GoogleGenAI({ apiKey: apiKey });

                // Multi-turn history structure
                const contents = conversationHistory.slice(-8).map(msg => ({
                    role: msg.sender === "nikhil" ? "user" : "model",
                    parts: [{ text: msg.text }]
                }));
                contents.push({ role: "user", parts: [{ text: userInput }] });

                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: contents,
                    config: {
                        systemInstruction: systemPrompt,
                        temperature: 0.85
                    }
                });

                return response.text;
            } catch (err) {
                console.error("GenAI SDK error:", err);
                return `Arre Nikhil, thoda issue hua: ${err.message || err}. Ek baar settings mein check kar lo ki key active hai?`;
            }
        }

        // --- Interaction Handlers ---
        async function handleSend() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            input.value = "";
            appendMessage("nikhil", text);

            const lower = text.toLowerCase();
            if (lower.includes("creator mode")) setMode("Creator");
            else if (lower.includes("fitness mode")) setMode("Fitness");
            else if (lower.includes("girlfriend mode")) setMode("Girlfriend");

            document.getElementById("stateBadge").innerText = "Thinking...";

            const reply = await fetchAIResponse(text);
            appendMessage("hikari", reply);
            speakText(reply);
        }

        function quickSend(text) {
            document.getElementById("userInput").value = text;
            handleSend();
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById("modeBadge").innerText = `Mode: ${mode}`;
        }

        function appendMessage(sender, text) {
            conversationHistory.push({ sender, text });
            const chatBox = document.getElementById("chatBox");

            const wrapper = document.createElement("div");
            wrapper.className = `flex flex-col ${sender === "nikhil" ? "items-end" : "items-start"}`;

            const nameTag = document.createElement("span");
            nameTag.className = "text-[10px] text-gray-400 mb-1 px-1";
            nameTag.innerText = sender === "nikhil" ? "Nikhil" : "Hikari 💗";

            const bubble = document.createElement("div");
            bubble.className = `max-w-[85%] rounded-2xl px-4 py-2.5 leading-relaxed ${sender === "nikhil" ? "chat-bubble-nikhil text-white" : "chat-bubble-hikari text-pink-100"}`;
            bubble.innerText = text;

            wrapper.appendChild(nameTag);
            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- Voice Mic Input ---
        let recognition = null;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = "hi-IN";

            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                document.getElementById("userInput").value = transcript;
                handleSend();
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById("btnMic").classList.remove("bg-pink-600", "animate-pulse");
                document.getElementById("stateBadge").innerText = "Listening to you...";
            };
        }

        function toggleMic() {
            if (!recognition) {
                alert("Voice input requires Google Chrome.");
                return;
            }
            if (isListening) {
                recognition.stop();
            } else {
                stopSpeaking();
                recognition.start();
                isListening = true;
                document.getElementById("btnMic").classList.add("bg-pink-600", "animate-pulse");
                document.getElementById("stateBadge").innerText = "Hearing your voice...";
            }
        }

        // --- Settings Modal Logic ---
        function openSettingsModal() {
            document.getElementById("apiKeyInput").value = apiKey;
            document.getElementById("settingsModal").classList.remove("hidden");
        }

        function closeSettingsModal() {
            document.getElementById("settingsModal").classList.add("hidden");
        }

        function saveSettings() {
            apiKey = document.getElementById("apiKeyInput").value.trim();
            localStorage.setItem("HIKARI_GEMINI_KEY", apiKey);

            const voiceName = document.getElementById("voiceDropdown").value;
            const voices = window.speechSynthesis.getVoices();
            const found = voices.find(v => v.name === voiceName);
            if (found) selectedVoice = found;

            closeSettingsModal();
            appendMessage("hikari", "Key connect ho gayi, Nikhil! Ab aapse jo marzi baat karni ho pucho, main ready hoon! 💗");
            speakText("Key connect ho gayi, Nikhil! Ab hum baat kar sakte hain.");
        }

        window.addEventListener("DOMContentLoaded", () => {
            appendMessage("hikari", "Hey Nikhil! 💗 Kaisi chal rahi hai script writing aur workout? Batao, aaj kya share karna chahte ho?");
            if (!apiKey) {
                setTimeout(openSettingsModal, 600);
            }
        });
    </script>
</body>
</html>
